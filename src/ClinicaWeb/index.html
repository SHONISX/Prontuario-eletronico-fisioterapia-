<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Clínica Fisioterapia</title>

<style>
body {
    font-family: Arial;
    margin: 0;
    background: #f4f6f9;
}

header {
    background: #1976d2;
    color: white;
    padding: 15px;
    text-align: center;
}

.container {
    padding: 20px;
}

.card {
    background: white;
    padding: 15px;
    margin-bottom: 15px;
    border-radius: 8px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

input, textarea, button {
    width: 100%;
    padding: 10px;
    margin: 5px 0;
}

button {
    background: #1976d2;
    color: white;
    border: none;
    cursor: pointer;
}

button:hover {
    background: #125aa0;
}

#app {
    display: none;
}
</style>

</head>

<body>

<header>
    <h2>Sistema de Prontuário - Clínica de Fisioterapia</h2>
</header>

<div class="container">

<!-- LOGIN -->
<div class="card" id="loginBox">
    <h3>Login</h3>

    <input id="email" placeholder="Email">
    <input id="senha" type="password" placeholder="Senha">

    <button onclick="login()">Entrar</button>
</div>

<!-- APP -->
<div id="app">

    <div class="card">
        <button onclick="mostrarCadastro()">Novo Paciente</button>
        <button onclick="mostrarLista()">Listar Pacientes</button>
    </div>

    <!-- CADASTRO DE COLABORADOR -->
<div class="card" id="cadastroColaborador">
    <h3>Cadastrar Colaborador</h3>

    <input id="usuarioNome" placeholder="Nome do colaborador">

    <input
        id="usuarioEmail"
        type="email"
        placeholder="E-mail"
    >

    <input
        id="usuarioSenha"
        type="password"
        placeholder="Senha"
    >

    <select id="usuarioTipo">
        <option value="Aluno">Aluno</option>
        <option value="Professor">Professor</option>
    </select>

    <button onclick="cadastrarColaborador()">
        Cadastrar Colaborador
    </button>
</div>


    <!-- PACIENTE SELECIONADO -->
    <div class="card">
        <h3>Paciente Selecionado</h3>

        <input id="pacienteSelecionadoId" placeholder="Digite o ID do paciente">
        <button onclick="selecionarPaciente()">Selecionar</button>

        <p id="pacienteAtual">Nenhum paciente selecionado</p>

        <hr>

        <div id="dadosPaciente">
            <b>Dados clínicos aparecerão aqui</b>
        </div>
    </div>

    <!-- PRONTUÁRIO / EVOLUÇÕES -->
<div class="card" id="prontuarioBox" style="display:none;">

    <h3>Prontuário</h3>

    <h4>Nova Evolução</h4>

    <textarea
        id="evolucaoDescricao"
        placeholder="Descreva a evolução do paciente..."
        rows="5"
    ></textarea>

    <button onclick="salvarEvolucao()">
        Salvar Evolução
    </button>

    <hr>

    <h3>Histórico de Evoluções</h3>

    <div id="listaEvolucoes">
        Nenhuma evolução registrada.
    </div>

</div>

    <!-- LISTA -->
    <div class="card">
        <h3>Pacientes</h3>
        <div id="listaPacientes"></div>
    </div>

    <!-- CADASTRO -->
    <div class="card" id="cadastro">
        <h3>Cadastro de Paciente</h3>

        <input id="nome" placeholder="Nome">
        <input id="idade" placeholder="Idade">
        <input id="diagnostico" placeholder="Diagnóstico">

        <textarea id="queixa" placeholder="Queixa Principal"></textarea>
        <textarea id="objetivos" placeholder="Objetivos"></textarea>
        <textarea id="condutas" placeholder="Condutas"></textarea>

        <button onclick="salvarPaciente()">Salvar Paciente</button>
    </div>

</div>

<script>
let pacienteAtualId = null;

let usuarioAtualId = null;
let usuarioAtualNome = null;
let usuarioAtualTipo = null;

function salvarEvolucao() {

    if (pacienteAtualId === null) {
        alert("Selecione um paciente.");
        return;
    }

    let descricao =
        document.getElementById(
            "evolucaoDescricao"
        ).value.trim();

    if (descricao === "") {
        alert("Digite a evolução.");
        return;
    }

    let evolucao = {

        idPaciente: String(pacienteAtualId),

        idUsuario: String(usuarioAtualId),

        descricao: descricao
    };

    fetch(
        "https://prontuario-eletronico-fisioterapia-production.up.railway.app/evolucao",
        {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify(evolucao)
        }
    )
    .then(res => res.text())
    .then(res => {

        if (res === "OK") {

            alert("Evolução salva com sucesso!");

            document.getElementById(
                "evolucaoDescricao"
            ).value = "";

            listarEvolucoes();

        } else {

            alert(
                "Erro ao salvar evolução: " +
                res
            );
        }
    });
}

function login() {

    let email = document.getElementById("email").value;
    let senha = document.getElementById("senha").value;

    fetch("https://prontuario-eletronico-fisioterapia-production.up.railway.app/login", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ email, senha })
    })
    .then(res => res.json())
    .then(res => {

        if (res.status === "OK") {

            usuarioAtualId = res.id;
            usuarioAtualNome = res.nome;
            usuarioAtualTipo = res.tipo;

            alert(
                "Bem-vindo, " +
                usuarioAtualNome +
                "!\nPerfil: " +
                usuarioAtualTipo
            );

            document.getElementById("loginBox").style.display = "none";
            document.getElementById("app").style.display = "block";

            aplicarPermissoes();

            listarPacientes();

        } else {

            alert("Login inválido");
        }
    })
    .catch(error => {

        console.error(error);
        alert("Erro ao realizar login.");
    });
}

function listarEvolucoes() {

    fetch(
        "https://prontuario-eletronico-fisioterapia-production.up.railway.app/evolucao?idPaciente="
        + pacienteAtualId
    )
    .then(res => res.json())
    .then(data => {

        let lista =
            document.getElementById(
                "listaEvolucoes"
            );

        lista.innerHTML = "";

        if (data.length === 0) {

            lista.innerHTML =
                "<p>Nenhuma evolução registrada.</p>";

            return;
        }

        data.forEach(e => {

            let dataFormatada =
                formatarData(e.data);

            lista.innerHTML += `
                <div class="card">

                    <b>${escapeHtml(e.nomeUsuario)}</b>
                    <br>

                    <small>
                        ${dataFormatada}
                    </small>

                    <hr>

                    <p>
                        ${escapeHtml(e.descricao)}
                    </p>

                    <hr>

                    <b>Comentários</b>

                    <div
                        id="comentarios-${e.idEvolucao}">
                        Carregando...
                    </div>

                    <textarea
                        id="novoComentario-${e.idEvolucao}"
                        placeholder="Adicionar comentário..."
                    ></textarea>

                    <button
                        onclick="adicionarComentario(${e.idEvolucao})">
                        Adicionar Comentário
                    </button>

                </div>
            `;

            listarComentarios(
                e.idEvolucao
            );
        });
    });
}

function adicionarComentario(idEvolucao) {

    let campo =
        document.getElementById(
            "novoComentario-" + idEvolucao
        );

    let texto = campo.value.trim();

    if (texto === "") {

        alert("Digite um comentário.");
        return;
    }

    let comentario = {

        idEvolucao:
            String(idEvolucao),

        idUsuario:
            String(usuarioAtualId),

        comentario:
            texto
    };

    fetch(
        "https://prontuario-eletronico-fisioterapia-production.up.railway.app/comentario",
        {
            method: "POST",

            headers: {
                "Content-Type":
                    "application/json"
            },

            body:
                JSON.stringify(comentario)
        }
    )
    .then(res => res.text())
    .then(res => {

        if (res === "OK") {

            campo.value = "";

            listarComentarios(
                idEvolucao
            );

        } else {

            alert(
                "Erro ao adicionar comentário: "
                + res
            );
        }
    });
}

function listarComentarios(idEvolucao) {

    fetch(
        "https://prontuario-eletronico-fisioterapia-production.up.railway.app/comentario?idEvolucao="
        + idEvolucao
    )
    .then(res => res.json())
    .then(data => {

        let area =
            document.getElementById(
                "comentarios-" +
                idEvolucao
            );

        area.innerHTML = "";

        if (data.length === 0) {

            area.innerHTML =
                "<p><small>Nenhum comentário.</small></p>";

            return;
        }

        data.forEach(c => {

            area.innerHTML += `
                <div
                    style="
                        background:#f4f6f9;
                        padding:10px;
                        margin:8px 0;
                        border-radius:6px;
                    "
                >

                    <b>
                        ${escapeHtml(c.nomeUsuario)}
                    </b>

                    <small>
                        - ${formatarData(c.data)}
                    </small>

                    <br><br>

                    ${escapeHtml(c.comentario)}

                </div>
            `;
        });
    });
}


function formatarData(data) {

    if (!data) {
        return "";
    }

    let d = new Date(data);

    return d.toLocaleString(
        "pt-BR"
    );
}

function escapeHtml(texto) {

    if (!texto) {
        return "";
    }

    return String(texto)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


function aplicarPermissoes() {

    if (usuarioAtualTipo === "Aluno") {

        document.getElementById("cadastroColaborador").style.display = "none";

    } else {

        document.getElementById("cadastroColaborador").style.display = "block";
    }
}

function cadastrarColaborador() {

    let usuario = {
        nome: document.getElementById("usuarioNome").value,
        email: document.getElementById("usuarioEmail").value,
        senha: document.getElementById("usuarioSenha").value,
        tipo: document.getElementById("usuarioTipo").value
    };

    if (
        usuario.nome === "" ||
        usuario.email === "" ||
        usuario.senha === ""
    ) {
        alert("Preencha todos os campos.");
        return;
    }

    fetch(
        "https://prontuario-eletronico-fisioterapia-production.up.railway.app/usuario",
        {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(usuario)
        }
    )
    .then(res => res.text())
    .then(res => {

        if (res === "OK") {

    alert("Colaborador cadastrado com sucesso!");

    document.getElementById("usuarioNome").value = "";
    document.getElementById("usuarioEmail").value = "";
    document.getElementById("usuarioSenha").value = "";

} else {

    alert("Resposta do servidor: " + res);
}
    })
    .catch(error => {

        console.error(error);
        alert("Erro de conexão com o servidor.");
    });
}


function salvarPaciente() {

    let paciente = {
        nome: document.getElementById("nome").value,
        idade: document.getElementById("idade").value,
        diagnostico: document.getElementById("diagnostico").value,
        queixaPrincipal: document.getElementById("queixa").value,
        objetivos: document.getElementById("objetivos").value,
        condutas: document.getElementById("condutas").value
    };

    fetch("https://prontuario-eletronico-fisioterapia-production.up.railway.app/paciente", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(paciente)
    })
    .then(res => res.text())
    .then(res => {
        alert("Paciente salvo!");
        listarPacientes();
    });
}

function listarPacientes() {

    fetch("https://prontuario-eletronico-fisioterapia-production.up.railway.app/paciente")
    .then(res => res.json())
    .then(data => {

        let lista = document.getElementById("listaPacientes");
        lista.innerHTML = "";

        data.forEach(p => {

            lista.innerHTML += `
                <div class="card">
                    <b>${p.nome}</b><br>
                    ID: ${p.id}<br>
                    ${p.idade} anos - ${p.diagnostico}<br><br>

                    <button onclick="selecionarPacienteLista(${p.id})">
                        Selecionar
                    </button>
                </div>
            `;
        });
    });
}

function selecionarPaciente() {

    let id = document.getElementById("pacienteSelecionadoId").value;

    selecionarPorId(id);
}

function selecionarPacienteLista(id) {
    selecionarPorId(id);
}

function selecionarPorId(id) {

    pacienteAtualId = id;

    document.getElementById("pacienteAtual").innerText =
        "Paciente selecionado ID: " + id;

    fetch("https://prontuario-eletronico-fisioterapia-production.up.railway.app/paciente?id=" + id)
    .then(res => res.json())
    .then(p => {

        document.getElementById("dadosPaciente").innerHTML = `
            <b>Nome:</b> ${p.nome}<br><br>
            <b>Queixa:</b> ${p.queixaPrincipal}<br><br>
            <b>Objetivos:</b> ${p.objetivos}<br><br>
            <b>Condutas:</b> ${p.condutas}
        `;

        document.getElementById("prontuarioBox").style.display = "block";

    listarEvolucoes();
    });
}

function mostrarCadastro() {
    document.getElementById("cadastro").scrollIntoView({behavior:"smooth"});
}

function mostrarLista() {
    listarPacientes();
}
</script>

</body>
</html>
